name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create ZIP
        run: |
          cd custom_components
          zip -r ../thermomaven-${{ steps.version.outputs.VERSION }}.zip thermomaven/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThermoMaven v${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES_${{ steps.version.outputs.VERSION }}.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') }}
          files: thermomaven-${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

